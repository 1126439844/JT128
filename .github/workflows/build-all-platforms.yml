# 工作流名称
name: Build JT128 All Platforms (CMake)

# 触发条件
on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 平台矩阵：移除macos-12 x86_64组合
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        arch: [ x86_64, arm64 ]
        # 排除不支持的组合
        exclude:
          - os: windows-latest
            arch: arm64
          - os: macos-latest
            arch: x86_64  # 仅保留macos-latest arm64

    steps:
      # 步骤1：检出dev分支源码
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      # 步骤2：配置JDK17（若项目依赖Java）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: ${{ matrix.arch }}

      # 步骤3：安装CMake及编译依赖
      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y cmake gcc g++

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos-')
        run: brew install cmake

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

      # 步骤4：CMake构建（产物输出到根目录build文件夹）
      - name: CMake Configure & Build
        run: |
          # 创建根目录的build文件夹并编译
          mkdir -p build && cd build
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake -G "Visual Studio 17 2022" -A ${{ matrix.arch == 'x86_64' && 'x64' || 'ARM64' }} ..
            cmake --build . --config Release
          else
            cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch == 'x86_64' && 'x86_64' || 'arm64' }} ..
            make -j$(nproc)
          fi
        shell: bash

      # 步骤5：上传build目录下的产物
      - name: Upload build artifacts (output to JT128/build)
        uses: actions/upload-artifact@v4
        with:
          name: JT128-${{ runner.os }}-${{ matrix.arch }}
          path: |
            build/**/*.dll   # Windows动态库（build目录下）
            build/**/*.so    # Linux动态库（build目录下）
            build/**/*.dylib # macOS动态库（build目录下）
          if-no-files-found: error  # 无产物时中断，便于排查
