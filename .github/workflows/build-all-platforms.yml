# 工作流名称（GitHub Actions页面显示）
name: Build JT128 All Platforms (CMake)

# 触发条件：推送到dev分支 或 手动触发（方便测试）
on:
  push:
    branches: [ dev ]  # 仅dev分支推送时自动触发
  workflow_dispatch:  # 允许手动触发

# 多平台编译作业
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # 一个平台失败不影响其他平台
      matrix:
        # 平台矩阵：覆盖目标系统+架构（去掉mac x86）
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        arch: [ x86_64, arm64 ]
        # 排除不支持的组合
        exclude:
          - os: macos-latest
            arch: x86_64  # macos-latest仅支持arm64
          - os: windows-latest
            arch: arm64   # Windows runner暂无arm64环境

    steps:
      # 步骤1：检出dev分支源码
      - name: Checkout dev branch source code
        uses: actions/checkout@v4
        with:
          ref: dev  # 强制检出dev分支

      # 步骤2：配置JDK 17（若项目依赖Java，无依赖可删除）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: ${{ matrix.arch }}

      # 步骤3：安装CMake及编译依赖（分平台）
      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y cmake gcc g++
        shell: bash

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos-')
        run: brew install cmake
        shell: bash

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        shell: cmd

      # 步骤4：定义平台+架构输出目录（自动创建）
      - name: Define platform&arch output directory
        id: set_output_dir
        run: |
          # 拼接平台+架构目录
          if [ "$RUNNER_OS" == "Windows" ]; then
            OUTPUT_DIR="build/windows/${{ matrix.arch }}"
          elif [ "$RUNNER_OS" == "Linux" ]; then
            OUTPUT_DIR="build/linux/${{ matrix.arch }}"
          elif [ "$RUNNER_OS" == "macOS" ]; then
            OUTPUT_DIR="build/mac/${{ matrix.arch }}"
          fi
          # 递归创建目录（核心：-p参数自动创建所有层级）
          mkdir -p $OUTPUT_DIR
          echo "OUTPUT_DIR=${OUTPUT_DIR}" >> $GITHUB_ENV
        shell: bash

      # 步骤5：CMake编译（核心步骤，适配跨平台）
      - name: Build with CMake
        run: |
          # 进入目标输出目录
          cd ${{ env.OUTPUT_DIR }}
          # 适配不同系统的CMake编译命令
          if [ "$RUNNER_OS" == "Windows" ]; then
            # Windows使用Visual Studio生成器
            cmake -G "Visual Studio 17 2022" -A ${{ matrix.arch == 'x86_64' && 'x64' || 'ARM64' }} ../..
            cmake --build . --config Release
          else
            # Linux/macOS使用默认生成器
            cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} ../..
            make -j$(nproc)
          fi
        shell: bash

      # 步骤6：上传全平台产物（匹配自动创建的目录）
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JT128-${{ runner.os }}-${{ matrix.arch }}
          path: |
            build/windows/x86_64/**/*  # Windows x86_64产物（.dll等）
            build/linux/x86_64/**/*    # Linux x86_64产物（.so等）
            build/linux/arm64/**/*     # Linux arm64产物（.so等）
            build/mac/arm64/**/*       # macOS arm64产物（.dylib等）
          if-no-files-found: warn  # 无文件仅警告，便于排查
